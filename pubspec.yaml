name: booknotes
description: BookNotes - an offline-first digital notebook that looks and feels like a physical book.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  archive: ^3.6.1   # keep on 3.x: ZipEncoder/ArchiveFile API used in book_transfer.dart
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
