name: Auto Format Dart

on:
  push:
    branches: [main, "t5/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve package configuration
        run: flutter pub get 
      - name: Format Dart files
        run: dart format lib test

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style: format Dart files"
